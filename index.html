<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FHM PEDIA</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
background:linear-gradient(135deg,#08111f,#111827,#0f172a);
color:#fff;
}
.container{
max-width:560px;
margin:auto;
padding:15px;
}
.card{
background:rgba(255,255,255,.05);
padding:16px;
margin-top:15px;
border-radius:18px;
}
input,select,textarea,button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:12px;
}
input,select,textarea{
background:#111827;
color:#fff;
}
button{
background:linear-gradient(90deg,#06b6d4,#2563eb);
color:#fff;
font-weight:bold;
cursor:pointer;
}
.hidden{display:none}
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-radius:15px;
background:rgba(255,255,255,.05);
}
.coin{
background:#10b981;
padding:8px 12px;
border-radius:12px;
}
.item{
background:#111827;
padding:12px;
border-radius:12px;
margin-top:10px;
}
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px;
}
.menu{
background:#111827;
padding:12px;
border-radius:12px;
text-align:center;
font-size:13px;
}
</style>
</head>
<body>

<div class="container">

<div id="home" class="card">
<h2>🚀 FHM PEDIA</h2>

<button onclick="showRegister()">Daftar Member</button>
<button onclick="showLogin()">Login Member</button>
<button onclick="showAdmin()">Login Admin</button>
</div>

<div id="registerBox" class="card hidden">
<h2>Daftar</h2>

<input id="regName" placeholder="Nama">
<input id="regUser" placeholder="Username">
<input id="regPass" type="password" placeholder="Password">

<button onclick="register()">Daftar</button>
<button onclick="backHome()">Kembali</button>
</div>

<div id="loginBox" class="card hidden">
<h2>Login Member</h2>

<input id="loginUser">
<input id="loginPass" type="password">

<button onclick="loginMember()">Masuk</button>
<button onclick="backHome()">Kembali</button>
</div>

<div id="adminBox" class="card hidden">
<h2>Login Admin</h2>

<input id="adminUser">
<input id="adminPass" type="password">

<button onclick="loginAdmin()">Masuk</button>
<button onclick="backHome()">Kembali</button>
</div>

<div id="memberDash" class="hidden">

<div class="header">
<b id="memberName"></b>
<div class="coin">
🪙 <span id="coin">0</span>
</div>
</div>

<div class="card">
<h2>Top Up</h2>

<input id="topupNominal" type="number" placeholder="Nominal">

<button onclick="topup()">Kirim Topup</button>

<div id="invoice"></div>
</div>

<div class="card">
<h2>Order FHM PEDIA</h2>

<select id="kategori">
<option>Instagram</option>
<option>Facebook</option>
<option>TikTok</option>
<option>YouTube</option>
<option>Shopee</option>
<option>WhatsApp</option>
</select>

<input id="link" placeholder="Link">
<input id="jumlah" placeholder="Jumlah">

<textarea id="ket" placeholder="Keterangan"></textarea>

<button onclick="submitOrder()">Submit</button>
</div>

<div class="card">
<h2>Layanan</h2>

<div class="grid">
<div class="menu">PPOB</div>
<div class="menu">TikTok</div>
<div class="menu">Shopee</div>
<div class="menu">YouTube</div>
<div class="menu">WhatsApp</div>
<div class="menu">Marketplace</div>
</div>
</div>

<div class="card">
<h2>Riwayat</h2>
<div id="history"></div>
</div>

<button onclick="logout()">Logout</button>
</div>

<div id="adminDash" class="hidden">

<div class="card">
<h2>⚙️ Panel Admin</h2>

<input id="rekening" placeholder="Nomor rekening">
<input id="qr" placeholder="Link QR">

<button onclick="savePayment()">
Simpan pembayaran
</button>

<div id="memberList"></div>
<div id="orderList"></div>

<button onclick="logout()">
Logout
</button>

</div>
</div>

</div>

<script>

let currentMember=null;

function hideAll(){
[
home,
registerBox,
loginBox,
adminBox,
memberDash,
adminDash
].forEach(a=>a.classList.add("hidden"));
}

function backHome(){
hideAll();
home.classList.remove("hidden");
}

function showRegister(){
hideAll();
registerBox.classList.remove("hidden");
}

function showLogin(){
hideAll();
loginBox.classList.remove("hidden");
}

function showAdmin(){
hideAll();
adminBox.classList.remove("hidden");
}

function getMembers(){
return JSON.parse(
localStorage.getItem("members")
||"[]"
);
}

function saveMembers(a){
localStorage.setItem(
"members",
JSON.stringify(a)
);
}

function register(){

let list=getMembers();

list.push({
name:regName.value,
user:regUser.value,
pass:regPass.value,
coin:0
});

saveMembers(list);

alert("Daftar berhasil");

showLogin();
}

function loginMember(){

let akun=
getMembers().find(a=>

a.user===loginUser.value &&
a.pass===loginPass.value

);

if(!akun){
alert("Login ditolak");
return;
}

currentMember=akun;

hideAll();

memberDash.classList.remove("hidden");

memberName.innerText=
"👤 "+akun.name;

coin.innerText=
akun.coin||0;

showHistory();
}

function loginAdmin(){

if(
adminUser.value==="admin" &&
adminPass.value==="fhm123"
){

hideAll();

adminDash.classList.remove("hidden");

renderAdmin();

}else{

alert("Admin salah");

}
}

function topup(){

let p=
JSON.parse(
localStorage.getItem("payment")
||"{}"
);

invoice.innerHTML=`

<div class="item">

Invoice:
INV${Date.now()}

<br><br>

Nominal:
Rp ${Number(topupNominal.value||0).toLocaleString()}

<br><br>

Status:
Menunggu admin

<br><br>

${p.rekening||""}

<br>

${p.qr||""}

</div>
`;
}

function submitOrder(){

let list=
JSON.parse(
localStorage.getItem("orders")
||"[]"
);

list.unshift({

member:currentMember.name,

kategori:kategori.value,

link:link.value,

jumlah:jumlah.value,

ket:ket.value,

status:"Pending"

});

localStorage.setItem(
"orders",
JSON.stringify(list)
);

showHistory();

alert("Order masuk");
}

function showHistory(){

let list=
JSON.parse(
localStorage.getItem("orders")
||"[]"
);

history.innerHTML="";

list
.filter(a=>a.member===currentMember.name)
.forEach(a=>{

history.innerHTML+=`

<div class="item">

${a.kategori}

<br>

${a.link}

<br>

${a.status}

</div>

`;

});
}

function renderAdmin(){

let m=getMembers();

memberList.innerHTML="<h3>Member</h3>";

m.forEach((a,i)=>{

memberList.innerHTML+=`

<div class="item">

${a.name}

<input
value="${a.coin||0}"
onchange="updateCoin(${i},this.value)">

</div>

`;

});

let orders=
JSON.parse(
localStorage.getItem("orders")
||"[]"
);

orderList.innerHTML="<h3>Order</h3>";

orders.forEach((a,i)=>{

orderList.innerHTML+=`

<div class="item">

${a.member}

<br>

${a.kategori}

<select
onchange="updateStatus(${i},this.value)">

<option>Pending</option>
<option>Proses</option>
<option>Sukses</option>

</select>

</div>

`;

});
}

function updateCoin(i,val){

let m=getMembers();

m[i].coin=
parseInt(val||0);

saveMembers(m);
}

function updateStatus(i,val){

let o=
JSON.parse(
localStorage.getItem("orders")
||"[]"
);

o[i].status=val;

localStorage.setItem(
"orders",
JSON.stringify(o)
);
}

function savePayment(){

localStorage.setItem(
"payment",
JSON.stringify({
rekening:rekening.value,
qr:qr.value
})
);

alert("Tersimpan");
}

function logout(){
location.reload();
}

</script>
</body>
</html>
